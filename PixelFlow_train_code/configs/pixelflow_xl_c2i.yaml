model:
  target: pixelflow.model.PixelFlowModel
  params:
    num_attention_heads: 16
    attention_head_dim: 72
    in_channels: 3
    out_channels: 3
    depth: 28
    num_classes: 1000
    patch_size: 4
    attention_bias: true

scheduler:
  num_train_timesteps: 1000
  num_stages: 4
  pyramid_shift: false

train:
  lr: 1e-4
  weight_decay: 0.0
  epochs: 10

data:
  dataset: imagefolder   # imagefolder | mri
  root: /public/datasets/ILSVRC2012/train
  center_crop: false
  resolution: 256
  expand_ratio: 1.125
  # MRI-specific options (used when data.dataset == mri)
  pt_key: slices
  target_mode: class_index
  recursive: true
  return_metadata: false
  max_samples: null
  skip_broken_files: false
  verbose: false
  random_horizontal_flip: true
  normalize: true
  normalize_mean: 0.5
  normalize_std: 0.5
  num_workers: 4
  batch_size: 4

seed: 42
